<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex Search</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-200 bg-white px-6 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-semibold text-blue-900 tracking-tight">Codex</h1>
            <span class="text-xs text-slate-400 font-medium">Historical Document Search</span>
        </div>
        <button id="new-chat-btn" class="text-xs text-slate-500 hover:text-slate-700 px-3 py-1.5
                                         border border-slate-200 rounded-md hover:bg-slate-50
                                         transition-colors" title="Start a new conversation">
            New Chat
        </button>
    </header>

    <!-- Main content area -->
    <main class="flex-1 flex overflow-hidden">

        <!-- Future sidebar placeholder (Phase 3) -->
        <aside id="sidebar" class="hidden w-64 border-r border-slate-200 bg-white overflow-y-auto shrink-0">
        </aside>

        <!-- Chat area -->
        <div class="flex-1 flex flex-col min-w-0">
            <div id="chat-messages" class="flex-1 overflow-y-auto">
                <div class="max-w-3xl mx-auto w-full p-6 space-y-6">

                    <!-- Welcome message -->
                    <div id="welcome" class="text-center mt-24 space-y-3">
                        <div class="text-4xl">&#128218;</div>
                        <p class="text-lg text-slate-500">Ask a question about the indexed documents</p>
                        <p class="text-sm text-slate-400">Results are drawn from historical records, deeds, and local history materials.</p>
                    </div>

                </div>
            </div>

            <!-- Input area -->
            <div class="border-t border-slate-200 bg-white p-4 shrink-0">
                <form id="search-form" class="max-w-3xl mx-auto flex gap-3">
                    <input id="query-input" type="text"
                           placeholder="Ask a question..."
                           class="flex-1 rounded-lg border border-slate-300 px-4 py-2.5
                                  text-sm focus:outline-none focus:ring-2 focus:ring-blue-500
                                  focus:border-transparent placeholder:text-slate-400"
                           autocomplete="off">
                    <button type="submit" id="submit-btn"
                            class="rounded-lg bg-blue-600 px-5 py-2.5 text-white text-sm
                                   font-medium hover:bg-blue-700 disabled:opacity-50
                                   disabled:cursor-not-allowed transition-colors">
                        Search
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
