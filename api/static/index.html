<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex Search</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="border-b border-slate-200 bg-white px-6 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <button id="sidebar-toggle" class="p-1.5 rounded-md hover:bg-slate-100 text-slate-500
                                                hover:text-slate-700 transition-colors" title="Hide sidebar">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
                </svg>
            </button>
            <h1 class="text-xl font-semibold text-blue-900 tracking-tight">Codex</h1>
            <span class="text-sm text-slate-400 font-medium hidden sm:inline">Historical Document Search</span>
        </div>
        <button id="new-chat-btn" class="text-sm text-slate-500 hover:text-slate-700 px-3 py-1.5
                                         border border-slate-200 rounded-md hover:bg-slate-50
                                         transition-colors" title="Start a new conversation">
            New Chat
        </button>
    </header>

    <!-- Main content area -->
    <main class="flex-1 flex overflow-hidden">

        <!-- Document sidebar -->
        <aside id="sidebar" class="w-80 border-r border-slate-200 bg-white flex flex-col shrink-0">

            <!-- Sidebar header + upload button -->
            <div class="px-4 pt-4 pb-3 border-b border-slate-100">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wide">Documents</h2>
                    <button id="upload-btn"
                            class="text-sm font-medium px-3 py-1.5 rounded-md
                                   text-blue-600 border border-blue-200 hover:bg-blue-50
                                   transition-colors">
                        + Upload
                    </button>
                </div>
            </div>

            <!-- Search/filter -->
            <div class="px-4 py-2.5 border-b border-slate-100">
                <input id="doc-search" type="search" placeholder="Filter documents..."
                       class="w-full text-sm rounded-md border border-slate-200 px-3 py-2
                              focus:outline-none focus:ring-1 focus:ring-blue-500
                              placeholder:text-slate-400">
            </div>

            <!-- Document list (scrollable) -->
            <div id="doc-list" class="flex-1 overflow-y-auto">
            </div>

            <!-- Footer with count -->
            <div class="px-4 py-2.5 border-t border-slate-100 text-sm text-slate-400 text-center">
                <span id="doc-count">0</span> <span id="doc-count-label">documents</span>
            </div>
        </aside>

        <!-- Chat + Source panel container -->
        <div class="flex-1 flex min-w-0 min-h-0 overflow-hidden">

            <!-- Chat area -->
            <div class="flex-1 flex flex-col min-w-0">
                <div id="chat-messages" class="flex-1 overflow-y-auto">
                    <div class="max-w-4xl mx-auto w-full p-6 space-y-6">

                        <!-- Welcome message -->
                        <div id="welcome" class="text-center mt-20 space-y-4">
                            <div class="text-5xl">&#128218;</div>
                            <p class="text-xl text-slate-600 font-medium">Ask a question about the indexed documents</p>
                            <p class="text-base text-slate-400">Results are drawn from historical records, deeds, and local history materials.</p>
                            <div class="pt-4 flex flex-wrap justify-center gap-2">
                                <button class="suggested-query text-sm px-4 py-2 rounded-full border border-slate-200
                                               text-slate-500 hover:text-slate-700 hover:border-slate-300 hover:bg-white
                                               transition-colors">Who were the earliest settlers?</button>
                                <button class="suggested-query text-sm px-4 py-2 rounded-full border border-slate-200
                                               text-slate-500 hover:text-slate-700 hover:border-slate-300 hover:bg-white
                                               transition-colors">What industries were prominent?</button>
                                <button class="suggested-query text-sm px-4 py-2 rounded-full border border-slate-200
                                               text-slate-500 hover:text-slate-700 hover:border-slate-300 hover:bg-white
                                               transition-colors">Tell me about the founding of Cambridge</button>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Active document filter chip -->
                <div id="active-filters" class="hidden max-w-4xl mx-auto w-full px-6 pb-2 flex flex-wrap gap-2"></div>

                <!-- Input area -->
                <div class="border-t border-slate-200 bg-white px-6 py-4 shrink-0">
                    <form id="search-form" class="max-w-4xl mx-auto flex gap-3">
                        <input id="query-input" type="text"
                               placeholder="Ask a question..."
                               class="flex-1 rounded-xl border border-slate-300 px-5 py-3.5
                                      text-base focus:outline-none focus:ring-2 focus:ring-blue-500
                                      focus:border-transparent placeholder:text-slate-400"
                               autocomplete="off">
                        <button type="submit" id="submit-btn"
                                class="rounded-xl bg-blue-600 px-7 py-3.5 text-white text-base
                                       font-medium hover:bg-blue-700 disabled:opacity-50
                                       disabled:cursor-not-allowed transition-colors">
                            Search
                        </button>
                    </form>
                </div>
            </div>

            <!-- Source panel (slide-out, hidden by default) -->
            <aside id="source-panel" class="source-panel-closed border-l border-slate-200 bg-white flex flex-col shrink-0 min-h-0">
                <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between shrink-0">
                    <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wide">Sources</h3>
                    <button id="source-panel-close" class="p-1.5 rounded-md hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <div id="source-list" class="flex-1 overflow-y-auto"></div>
            </aside>

        </div>
    </main>

    <!-- Upload modal -->
    <dialog id="upload-modal" class="upload-modal rounded-xl shadow-xl border border-slate-200 p-0 w-full max-w-md backdrop:bg-black/40">
        <div class="p-6 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-semibold text-slate-800">Upload Document</h2>
                <button id="upload-modal-close" class="p-1.5 rounded-md hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Drop zone -->
            <div id="drop-zone"
                 class="border-2 border-dashed border-slate-300 rounded-lg p-8
                        text-center cursor-pointer hover:border-blue-400 hover:bg-blue-50/50
                        transition-colors">
                <label class="cursor-pointer block">
                    <svg class="w-10 h-10 mx-auto text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                              d="M12 16V4m0 0l-4 4m4-4l4 4M4 20h16"/>
                    </svg>
                    <span class="text-base text-slate-500">Drop a PDF or TXT file here, or click to browse</span>
                    <input id="upload-file" type="file" accept=".pdf,.txt" class="hidden">
                </label>
            </div>
            <p id="upload-file-name" class="hidden text-sm text-slate-700 font-medium truncate"></p>

            <!-- Metadata fields -->
            <div class="space-y-3">
                <div>
                    <label for="upload-title" class="block text-sm font-medium text-slate-500 mb-1">Title</label>
                    <input id="upload-title" type="text" placeholder="Document title"
                           class="w-full text-base rounded-md border border-slate-300 px-3 py-2
                                  focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label for="upload-authors" class="block text-sm font-medium text-slate-500 mb-1">Authors</label>
                        <input id="upload-authors" type="text" placeholder="Author names"
                               class="w-full text-base rounded-md border border-slate-300 px-3 py-2
                                      focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="w-28">
                        <label for="upload-year" class="block text-sm font-medium text-slate-500 mb-1">Year</label>
                        <input id="upload-year" type="number" placeholder="Year"
                               class="w-full text-base rounded-md border border-slate-300 px-3 py-2
                                      focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>
            </div>

            <!-- Upload status -->
            <div id="upload-status" class="hidden"></div>

            <!-- Action buttons -->
            <div class="flex justify-end gap-2 pt-1">
                <button id="upload-cancel"
                        class="text-sm text-slate-600 hover:text-slate-800 px-4 py-2
                               rounded-md hover:bg-slate-100 transition-colors">
                    Cancel
                </button>
                <button id="upload-submit"
                        class="text-sm font-medium py-2 px-5 rounded-md bg-blue-600
                               text-white hover:bg-blue-700 disabled:opacity-50 transition-colors">
                    Upload
                </button>
            </div>
        </div>
    </dialog>

    <script src="/static/sidebar.js?v=4"></script>
    <script src="/static/app.js?v=4"></script>
</body>
</html>
