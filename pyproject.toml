[project]
name = "codex"
version = "0.1.0"
description = "Indexing & Search POC for document ingestion and retrieval"
authors = [
    {name = "Codex Team"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pymupdf>=1.26.3",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.4.1",
    "meilisearch>=0.37.0",
    "openai>=2.0.0",
    "sentence-transformers>=5.1.0",
    "spacy>=3.7.2",
    "python-dotenv>=1.0.0",
    "click>=8.1.7",
    "tiktoken>=0.5.1",
    "langdetect>=1.0.9",
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "rapidfuzz>=3.0.0",
    "tabulate>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
