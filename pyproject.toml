[project]
name = "codex"
version = "0.1.0"
description = "Indexing & Search POC for document ingestion and retrieval"
authors = [
    {name = "Codex Team"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pymupdf (>=1.26.3,<2.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "pgvector (>=0.4.1,<0.5.0)",
    "meilisearch (>=0.37.0,<0.38.0)",
    "openai (>=1.100.2,<2.0.0)",
    "sentence-transformers (>=5.1.0,<6.0.0)",
    "spacy (>=3.8.7,<4.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "click (>=8.2.1,<9.0.0)",
    "tiktoken (>=0.11.0,<0.12.0)",
    "langdetect (>=1.0.9,<2.0.0)",
    "fastapi (>=0.116.1,<0.117.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "rapidfuzz (>=3.0.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
