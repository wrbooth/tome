[project]
name = "tome"
version = "0.1.0"
description = "Indexing & Search POC for document ingestion and retrieval"
authors = [
    {name = "Tome Team"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pymupdf>=1.26.3",
    "psycopg2-binary>=2.9.10",
    "meilisearch>=0.37.0",
    "openai>=2.0.0",
    "sentence-transformers>=5.1.0",
    "spacy>=3.7.2",
    "python-dotenv>=1.0.0",
    "click>=8.1.7",
    "tiktoken>=0.5.1",
    "langdetect>=1.0.9",
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "rapidfuzz>=3.0.0",
    "tabulate>=0.9.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.13.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tome"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
tome-ingest = "tome.ingestion.ingest:main"
tome-batch-ingest = "tome.ingestion.batch_ingest:main"
tome-batch-reingest = "tome.ingestion.batch_reingest:main"
tome-search = "tome.search.search:main"
tome-documents = "tome.documents:cli"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
markers = ["integration: integration tests requiring live services"]
addopts = "-n 4"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "A", "S", "BLE", "COM", "RET", "SIM", "C4", "RUF", "DTZ", "PT", "ISC", "FBT", "EM", "G", "SLF", "C90", "ERA", "PIE", "FURB", "PERF", "SLOT", "FA", "ASYNC", "RSE", "T20", "PTH"]
ignore = ["S603", "S607", "COM812", "T201", "BLE001", "FBT001", "FBT002", "FBT003", "E402"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "SLF001", "FBT001", "FBT002", "EM101", "E501"]
"src/tome/cli/**/*.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest-xdist>=3.8.0",
]
