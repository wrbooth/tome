services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tome
      POSTGRES_PASSWORD: tome
      POSTGRES_DB: tome
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  meili:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_NO_ANALYTICS: "true"
    command: ["meilisearch", "--env", "development"]
    ports: ["7700:7700"]

  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DB_HOST: postgres
      MEILI_URL: http://meili:7700
    depends_on:
      - postgres
      - meili

volumes:
  pgdata:
