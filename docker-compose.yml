services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tome
      POSTGRES_PASSWORD: tome
      POSTGRES_DB: tome
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  meili:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_NO_ANALYTICS: "true"
    command: ["meilisearch", "--env", "development"]
    ports: ["7700:7700"]

volumes:
  pgdata:








